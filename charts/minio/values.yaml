global:
  # The root chart name, stamped onto every object via prodbox.io/chart-root.
  rootChart: minio

# prodbox:lifecycle-authority-recovery-observer.values:start
recoveryObserver:
  serviceAccountName: prodbox-lifecycle-authority
  serviceAccountNamespace: lifecycle-authority
# prodbox:lifecycle-authority-recovery-observer.values:end

image:
  # Sprint 4.31: MinIO is a shared platform component. The reconcile install
  # overrides image.repository / image.tag via --set — the public quay.io
  # reference for the bootstrap pass and the in-cluster Harbor mirror
  # (127.0.0.1:30080/prodbox/minio-mirror) for the steady-state pass — so these
  # defaults are only a fallback.
  repository: quay.io/minio/minio
  tag: "RELEASE.2024-12-18T13-15-44Z"
  pullPolicy: IfNotPresent

ports:
  api: 9000
  console: 9001

storage:
  # Durable MinIO storage on the retained `manual` no-provisioner StorageClass,
  # rooted at `.data/<namespace>/<StatefulSet>/<ordinal>` (= `.data/prodbox/minio/0`)
  # per the storage-lifecycle doctrine. On the AWS substrate this is overridden
  # to the EKS `gp2` dynamic class via --set.
  className: manual
  size: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 1024Mi
  limits:
    cpu: 500m
    memory: 1024Mi
    ephemeral-storage: 2048Mi

# Sprint 7.25: the STATIC MinIO root credential, injected by `renderMinioChartArgs`
# (--set rootUser / rootPassword) from `Prodbox.Minio.RootCredential` (the single
# source of truth); these defaults are only a fallback. MinIO no longer reads its
# credential from Vault at startup, so it depends only on the cluster + its
# retained PV.
#
# This is the registered bootstrap-floor credential of vault_doctrine.md §6.1 —
# needed before Vault can be read, so it cannot be a Vault reference. It is a
# real credential; see the `Prodbox.Minio.RootCredential` module header for its
# reachability and blast radius. The bootstrap floor is the single registered
# exception to "no credential in chart values" (§20.3); it is not licence to
# hardcode anywhere else.
rootUser: prodbox-minio-root
rootPassword: prodboxMinioRootStaticCredentialV1
