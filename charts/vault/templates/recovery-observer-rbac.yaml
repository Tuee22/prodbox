{{- /* Exact-name, GET-only observation for the retained recovery profile. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-recovery-observer
  labels:
    {{- include "vault.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["vault"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-recovery-observer
  labels:
    {{- include "vault.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-recovery-observer
subjects:
  - kind: ServiceAccount
    name: {{ required "recoveryObserver.serviceAccountName is required" .Values.recoveryObserver.serviceAccountName | quote }}
    namespace: {{ required "recoveryObserver.serviceAccountNamespace is required" .Values.recoveryObserver.serviceAccountNamespace | quote }}
