config:
  # ID of the operator-owned parent Route 53 hosted zone (from
  # `route53.zone_id` in `prodbox-config.dhall`). NS delegation records for
  # the substrate subzone are inserted into this parent zone.
  parentZoneId:
    type: string
  # Fully-qualified subzone domain (e.g. `aws.test.resolvefintech.com`) sourced
  # from `aws_substrate.subzone_name` in `prodbox-config.dhall`. The subzone is
  # provisioned under this name and the parent zone receives an NS record
  # delegating queries for it.
  subzoneName:
    type: string

  # Sprint 7.41: the creating run's durable scope and the submission key its
  # create was admitted at. Both are committed durably -- in the lifecycle
  # generation and in the write-ahead ownership manifest -- before the effect
  # runs, so a resource carrying them can always be joined back to a record
  # that declared it.
  #
  # The default is what a stack created before this sprint carries, and it is
  # deliberately a statement rather than a blank: a destroy of such a stack must
  # not fail for want of a value nobody recorded.
  prodboxRunScope:
    type: string
    default: unrecorded
  prodboxSubmission:
    type: string
    default: unrecorded

variables:
  stackName: ${pulumi.stack}

resources:
  awsProvider:
    type: pulumi:providers:aws
    defaultProvider: true
    properties:
      # Sprint 7.41: the run that made these resources, stamped by the provider
      # onto every resource it creates rather than by each declaration. It is
      # the only marker that survives a host process kill between the admitted
      # create and its reply, and it is the join key back to the write-ahead
      # ownership manifest, which is keyed under this exact run scope.
      defaultTags:
        tags:
          prodbox.io/run-scope: ${prodboxRunScope}
          prodbox.io/submission: ${prodboxSubmission}
    options:
      envVarMappings:
        PRODBOX_PULUMI_AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
        PRODBOX_PULUMI_AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
        PRODBOX_PULUMI_AWS_SESSION_TOKEN: AWS_SESSION_TOKEN
        PRODBOX_PULUMI_AWS_REGION: AWS_REGION
        PRODBOX_PULUMI_AWS_DEFAULT_REGION: AWS_DEFAULT_REGION

  # Per-substrate hosted zone. cert-manager DNS01 challenges for AWS-substrate
  # certificates target this zone via the substrate-aware `ClusterIssuer`
  # rendered by `src/Prodbox/CLI/Rke2.hs::acmeClusterIssuerSpec` when called
  # with `SubstrateAws`.
  subzone:
    type: aws:route53:Zone
    properties:
      name: ${subzoneName}
      comment: prodbox AWS-substrate per-substrate subzone (managed by Pulumi stack ${stackName})
      # Sprint 7.48: the zone is per-run and holds records this program does not
      # declare -- the public-edge A record the reconcile writes through the
      # Provider and the cert-manager DNS01 challenge records -- and Route 53
      # refuses to delete a zone that still has any (HostedZoneNotEmpty). Without
      # this a healthy run ended with the destroy failing and the billable zone
      # left behind. It applies to a zone this program creates; a subzone made
      # before this change keeps the value its state recorded.
      forceDestroy: true
      tags:
        Name: ${stackName}
        prodbox.io/substrate: aws
        # The postflight tag sweep queries this key; a zone without it is invisible
        # to the sweep that gates the cascade uninstall.
        prodbox.io/managed-by: prodbox

  # NS delegation record in the operator-owned parent zone. The four NS values
  # come from the subzone's authoritative name servers, so queries for the
  # subzone resolve through the parent zone's authority chain.
  parentNsDelegation:
    type: aws:route53:Record
    properties:
      zoneId: ${parentZoneId}
      name: ${subzoneName}
      type: NS
      ttl: 300
      records: ${subzone.nameServers}

outputs:
  backend_bucket: prodbox-state
  subzone_id: ${subzone.zoneId}
  subzone_name: ${subzone.name}
  subzone_name_servers: ${subzone.nameServers}
  parent_zone_id: ${parentZoneId}
  parent_ns_record_fqdn: ${parentNsDelegation.fqdn}
