global:
  namespace: bootstrap-broker
  rootChart: bootstrap-broker

# prodbox:lifecycle-authority-recovery-observer.values:start
recoveryObserver:
  serviceAccountName: prodbox-lifecycle-authority
  serviceAccountNamespace: lifecycle-authority
# prodbox:lifecycle-authority-recovery-observer.values:end

podAnnotations: {}

image:
  # The single union runtime image (also used by the gateway and api/websocket
  # workloads). The broker role is selected by this chart's container `args:`
  # (`bootstrap-broker start …`), so the physically separate broker Pod shares
  # the image but never the identity, config mount, or failure domain of the
  # Gateway Runtime.
  repository: 127.0.0.1:30080/prodbox/prodbox-runtime
  tag: latest
  pullPolicy: Always

# Generated by the supported ChartPlatform render from the validated
# RuntimeMemoryPlan. Keep this default value-free: no chart-local heap cap is
# authoritative.
runtime:
  rtsArguments: []

# Static Bootstrap Broker chart identities — the Pod ServiceAccount, the
# bootstrap-owned ordinary-cleanup caller, the bootstrap-only Vault
# Kubernetes-auth role, and the constant-time lifecycle probe paths — generated
# from the one compiled
# `Prodbox.Bootstrap.Broker.ChartStatics` source of truth. The ServiceAccount
# name equals the Vault role (`VaultRoleBootstrapBroker`) so the Pod
# authenticates to Vault Kubernetes auth as its own bootstrap-only identity,
# and the probe paths are projections of the closed `BrokerRoute` registry so a
# kubelet probe can never point at a path the broker does not serve. This block
# is regenerated by `prodbox docs generate`; do not hand-edit it.
# prodbox:bootstrap-broker-chart-statics.values:start
serviceAccount:
  name: prodbox-bootstrap-broker
  workerName: prodbox-bootstrap-secret-worker
cleanupCaller:
  serviceAccountName: prodbox-control-plane-operator
client:
  serviceAccountName: prodbox-bootstrap-broker-client
  tokenAudience: prodbox-bootstrap-broker
worker:
  imageRepository: 127.0.0.1:30080/prodbox/prodbox-runtime
vault:
  role: prodbox-bootstrap-broker
probes:
  liveness: /healthz
  readiness: /readyz
# prodbox:bootstrap-broker-chart-statics.values:end

# Lifecycle probe timing. The broker's liveness/readiness endpoints are
# constant-time route projections (Sprint 2.34 route registry); deep capability
# observations execute through the broker's own client, never in a kubelet
# probe.
probeTiming:
  # The broker establishes its MinIO-backed durable boundary before opening
  # the listener. A startup probe prevents liveness from killing that bounded
  # initialization on a freshly reconciled cluster.
  startup:
    initialDelaySeconds: 1
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 60
    successThreshold: 1
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 6
    successThreshold: 1

# The broker listen port is deployment configuration, deliberately NOT a
# compiled static (unlike the gateway): the broker binds a loopback-restricted
# Service whose port the operator chooses per cluster.
listener:
  port: 8600

# Sprint 3.34: the shared port vocabulary bound by this chart's NetworkPolicy
# egress rules. Every default equals the literal it replaced — this block is a
# pure refactor of the previously hard-coded numbers. The Kubernetes API egress
# coordinate is deliberately NOT here: it stays under
# `.Values.kubernetesApiEgress.port`, bound from its single compiled owner.
ports:
  # Cluster DNS (kube-system), both UDP and TCP.
  dns: 53
  # In-cluster Vault API (init / unseal / seal / PKI status / test-issuance).
  vault: 8200
  # In-cluster MinIO object store.
  objectStore: 9000
  # In-cluster control-plane role listener — the exact authenticated custody
  # consumers (Target Secret Agent and Lifecycle Authority).
  controlPlane: 8600

# The Guaranteed-QoS resource envelope (request == limit) is injected at render
# time from the typed `capacity.resource_plan` (the `bootstrap-broker` workload
# profile) by `Prodbox.Lib.ChartPlatform.attachResourcePlanValues` into
# `.Values.resources.bootstrapBroker`, exactly like the gateway chart — the
# capacity plan is the single source of truth, so no chart-local default is kept
# here. Control-plane demand therefore never hides behind a combined gateway
# envelope (resource_scaling_doctrine.md § 2E).

# The mounted broker Dhall (runtime role `bootstrap-broker`, config identity
# `bootstrap-broker-config-v1`, mounted at /etc/bootstrap-broker/config). The
# empty default lets generic lint/template invocations omit the ConfigMap body;
# the supported ChartPlatform render always supplies it.
config:
  brokerDhall: ""
