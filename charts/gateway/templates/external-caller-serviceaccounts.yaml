{{- /*
Gateway-lifetime test-harness clients obtain short-lived Kubernetes
TokenRequest JWTs solely to log in through Vault Kubernetes auth.  Each
identity is non-automounting and can create a token only for itself; it is not
bound to any workload or Kubernetes resource permission.  The ordinary
teardown operator identity is owned by bootstrap core and is never rendered
here.
*/ -}}
{{- range $serviceAccount := .Values.externalCallers.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount | quote }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-self-tokenrequest" $serviceAccount | quote }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - {{ $serviceAccount | quote }}
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-self-tokenrequest" $serviceAccount | quote }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-self-tokenrequest" $serviceAccount | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount | quote }}
    namespace: {{ $.Values.global.namespace }}
{{- end }}
