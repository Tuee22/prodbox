apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-isolation
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websocket
          podSelector:
            matchLabels:
              app.kubernetes.io/name: websocket
      ports:
        - protocol: TCP
          port: {{ .Values.ports.http }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              postgres-operator.crunchydata.com/data: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.ports.postgres }}
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.http }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.ports.publicHttps }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.smtp.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oidc-session-validation-agent
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: oidc-session-validation-agent
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.ports.publicHttps }}
