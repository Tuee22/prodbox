{{- /*
Isolation policy for the retained home Lifecycle Authority. Egress is limited to
what the durable-journal + Model-B CAS coordinator actually needs — DNS, the
Vault API (transit lifecycle-aggregate/checkpoint + secret/lifecycle KV), the
in-cluster MinIO object store (Model-B CAS objects), its independently isolated
Authority Backup and TLS Retention Adapters, the fenced Provider Worker, the Target
Secret Agent's closed operation endpoints, its own authenticated Service route, and
external HTTPS to AWS. The authority has NO mesh egress. Ingress admits the
registered Provider Worker, Bootstrap Broker, exact one-shot Credential Provisioner, and Target
Secret Agent callers; kubelet liveness/readiness probes are node-local and unaffected.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifecycle-authority-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lifecycle-authority.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodbox-lifecycle-authority
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: lifecycle
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: provider-worker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-provider-worker
      ports:
        - protocol: TCP
          port: lifecycle
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bootstrap-broker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-bootstrap-broker
      ports:
        - protocol: TCP
          port: lifecycle
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: credential-provisioner
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-credential-provisioner
      ports:
        - protocol: TCP
          port: lifecycle
    # The standing Target Agent requests an authenticated intent and execution
    # permit for each Authority-owned one-shot TLS custody action. Namespace
    # and Pod identity both remain closed; no worker Pod matches this selector.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-secret-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-target-secret-agent
      ports:
        - protocol: TCP
          port: lifecycle
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    # Exact POST-DNAT Kubernetes API coordinate observed by ChartPlatform.
    # Namespace-local RBAC separately limits this egress to named GETs for the
    # closed recovery profile; no list/watch/Secret verb is granted.
    - to:
        {{- range .Values.kubernetesApiEgress.addresses }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.kubernetesApiEgress.port }}
    # Retained delivery obtains its Target execution intent through the same
    # authenticated public Authority route as every other caller.  The Service
    # resolves back to this exact release Pod, so default-deny egress must admit
    # that one self-service lane without opening the namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-lifecycle-authority
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodbox
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-minio
      ports:
        - protocol: TCP
          port: {{ .Values.ports.objectStore }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authority-backup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-authority-backup
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-secret-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-target-secret-agent
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tls-retention
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-tls-retention
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: provider-worker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-provider-worker
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.ports.publicHttps }}
