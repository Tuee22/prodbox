{{- /*
Isolation policy for the pre-Vault Bootstrap Broker. Egress is limited to what
the bounded broker route surface actually needs — DNS, the Kubernetes API for
TokenReview, the exact-name secret worker and Vault pristine reset, the Vault
API (init / unseal / seal / PKI status / test-issuance), the object store, and
the two exact authenticated custody consumers (Target Secret Agent and
Lifecycle Authority). The broker has NO mesh, generic-KV, Pulumi, or SES
egress. Ingress is
restricted to its own namespace; kubelet liveness/readiness probes are
node-local and unaffected.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-broker-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodbox-bootstrap-broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: broker
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    # Sprint 3.34: the Kubernetes API egress coordinate, bound from the single
    # compiled owner that observes `endpoints/kubernetes`. Both halves are the
    # POST-DNAT ones: kube-proxy translates the API Service before the CNI
    # evaluates egress, so a rule written against the Service coordinate
    # (`10.43.0.1:443`) matches nothing and the Broker's every API call is
    # dropped. The Broker's RBAC still restricts this path to create-only
    # TokenReview plus the exact-name Broker worker/Lease and Vault reset Role
    # permissions. pods/exec remains ungranted.
    - to:
        {{- range .Values.kubernetesApiEgress.addresses }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.kubernetesApiEgress.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodbox
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-minio
      ports:
        - protocol: TCP
          port: {{ .Values.ports.objectStore }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-secret-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-target-secret-agent
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifecycle-authority
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-lifecycle-authority
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
