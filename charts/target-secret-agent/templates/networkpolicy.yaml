{{- /*
Isolation policy for the substrate-local Target Secret Agent. Egress is limited
to what the agent actually needs — DNS and the Vault API (Kubernetes auth plus
the allowlisted target-secret KV / Transit operations). The agent has NO
object-store, mesh, Pulumi, SES, or external egress. Ingress is restricted to
its own namespace plus the Lifecycle Authority's authenticated, secret-free
decommission inventory request; kubelet liveness/readiness probes are node-local
and unaffected.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-secret-agent-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "target-secret-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodbox-target-secret-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: target
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifecycle-authority
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-lifecycle-authority
      ports:
        - protocol: TCP
          port: target
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bootstrap-broker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-bootstrap-broker
      ports:
        - protocol: TCP
          port: target
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: credential-provisioner
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-credential-provisioner
      ports:
        - protocol: TCP
          port: target
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
    # Sprint 3.34: the Kubernetes API egress coordinate, bound from the single
    # compiled owner that observes `endpoints/kubernetes` — the POST-DNAT
    # address and port, which is what the CNI evaluates this rule against. The
    # standing Agent's namespaced RBAC is the exact authorization boundary for
    # Job/Pod/ServiceAccount observation, attach, and UID-preconditioned
    # cleanup; no Secret verb is granted.
    - to:
        {{- range .Values.kubernetesApiEgress.addresses }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.kubernetesApiEgress.port }}
---
# A one-shot materializer has no ingress and may reach only cluster DNS and
# Vault.  In particular it has no AWS/public egress: AWS credentials are output
# material, never ambient worker authority.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-secret-worker-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "target-secret-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodbox-target-secret-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
