SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* Sprint 5.48: the frozen superseded ordering, kept so the model can be shown
\* to fail.  WriteAheadEnabled = FALSE is the 2026-09-08 revision: a generation
\* record names the cycle and nothing names the resources.  TLC must report a
\* violation of EveryProviderResourceIsDurablyNamed here, and `prodbox dev
\* tla-check` refuses if it does not.
CONSTANTS
    Coordinates = {vpc, cluster}
    Cycles = {c1, c2}
    NoCycle = none
    WriteAheadEnabled = FALSE

INVARIANTS
    TypeOK
    EveryProviderResourceIsDurablyNamed
    GenerationNamesACycleAndNeverAResource
    DispatchFollowsReadBackWriteAhead
    AppendedIdentitiesAreDeclared
    ScratchIsNeverTheOnlyRecord
