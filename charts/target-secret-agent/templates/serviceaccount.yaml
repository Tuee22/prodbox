{{- /*
ServiceAccount the Target Secret Agent Pod runs as. It is the Kubernetes-auth
identity for the least-privilege Vault role (`VaultRoleTargetSecretAgent`),
distinct from every other control-plane workload's role. The name is
`.Values`-driven from the compiled
Prodbox.Lifecycle.TargetSecretAgent.ChartStatics so it can never drift from the
compiled identity.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "target-secret-agent.labels" . | nindent 4 }}
---
# Ephemeral materializer identity.  Only Jobs rendered by the compiled Target
# worker may use it; its Vault role owns the exact data-CAS/HMAC surface that is
# deliberately absent from the standing Agent identity above.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prodbox-target-secret-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "target-secret-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: target-secret-worker
