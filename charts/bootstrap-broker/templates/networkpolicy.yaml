{{- /*
Isolation policy for the pre-Vault Bootstrap Broker. Egress is limited to what
the bounded broker route surface actually needs — DNS, the Kubernetes API for
TokenReview, the exact-name secret worker and Vault pristine reset, the Vault
API (init / unseal / seal / PKI status / test-issuance), the object store, and
the two exact authenticated custody consumers (Target Secret Agent and
Lifecycle Authority). The broker has NO mesh, generic-KV, Pulumi, or SES
egress. Ingress is
restricted to its own namespace; kubelet liveness/readiness probes are
node-local and unaffected.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-broker-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodbox-bootstrap-broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: broker
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API Service endpoints are commonly host-networked rather than
    # selected by stable Pod labels. The Broker's RBAC still restricts this
    # path to create-only TokenReview plus the exact-name Broker worker/Lease
    # and Vault reset Role permissions. pods/exec remains ungranted.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodbox
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-secret-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-target-secret-agent
      ports:
        - protocol: TCP
          port: 8600
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifecycle-authority
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-lifecycle-authority
      ports:
        - protocol: TCP
          port: 8600
