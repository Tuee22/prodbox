{{- /*
The ambiguous-initialization reset arm is deliberately narrower than generic
Kubernetes administration. The Broker may observe the one Vault PVC, scale the
one Vault StatefulSet, and create/observe/UID-precondition-delete one fixed-name
reset Pod. Kubernetes cannot constrain create by resourceName, so the native
Broker interpreter remains the closed manifest/program boundary.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-broker-vault-pristine-reset
  namespace: vault
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets/scale
    resourceNames:
      - vault
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    resourceNames:
      - data-vault-0
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - pods
    resourceNames:
      - vault-0
      - bootstrap-vault-pristine-reset
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-broker-vault-pristine-reset
  namespace: vault
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-broker-vault-pristine-reset
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.global.namespace }}
