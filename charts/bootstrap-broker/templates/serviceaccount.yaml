{{- /*
ServiceAccount the Bootstrap Broker Pod runs as. It is the Kubernetes-auth
identity for the bootstrap-only Vault role (`VaultRoleBootstrapBroker`), which
is distinct from the Gateway Runtime's `prodbox-gateway-daemon` role. The name
is `.Values`-driven from the compiled Prodbox.Bootstrap.Broker.ChartStatics so
it can never drift from the compiled identity.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
---
# One-shot secret worker identity. It is deliberately disjoint from both the
# long-lived controller and host client identities; its projected credential
# can select only the closed worker Vault role/session.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.workerName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
---
# Secret-free host/controller caller identity. It has no Vault policy and no
# Kubernetes permissions; an already-authorized operator obtains only a
# short-lived custom-audience TokenRequest for Broker authentication.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.client.serviceAccountName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bootstrap-broker.labels" . | nindent 4 }}
