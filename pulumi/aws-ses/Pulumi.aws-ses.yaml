# hosted-zone id sat here across seven commits, indistinguishable from the
# synthetic zone ids used in the test suite. It is gone from the tree and
# permanent in history. Nothing here may carry a cloud resource id, an account
# id, or any other opaque identifier a reader cannot classify at a glance.
