global:
  namespace: default
  rootChart: api

replicaCount: 2

podAntiAffinity:
  enabled: true

podAnnotations: {}

image:
  repository: 127.0.0.1:30080/prodbox/prodbox-runtime
  tag: latest

gateway:
  name: public-edge
  namespace: vscode
  listenerName: https
  host: test.resolvefintech.com
  pathPrefix: /api

jwt:
  securityPolicyName: api-jwt
  providerName: keycloak
  issuer: https://test.resolvefintech.com/auth/realms/prodbox
  audience: prodbox-api
  jwksUri: http://keycloak.vscode.svc.cluster.local:8080/auth/realms/prodbox/protocol/openid-connect/certs
  jwksBackend:
    namespace: vscode
    serviceName: keycloak
    servicePort: 8080
    referenceGrantName: api-keycloak-jwks
  routeClaimName: prodbox_route
  routeClaimValue: api

api:
  port: 8080

# Shared port-binding convention (Sprint 3.34): every all-digit port literal in
# templates/ binds through .Values.ports.*. Defaults below equal the literals
# they replaced.
ports:
  # cluster DNS (kube-system CoreDNS, UDP + TCP)
  dns: 53
  # public-internet HTTPS egress to 0.0.0.0/0
  publicHttps: 443
