{{- /*
Isolation policy for the retained home Lifecycle Authority. Egress is limited to
what the durable-journal + Model-B CAS coordinator actually needs — DNS, the
Vault API (transit lifecycle-aggregate/checkpoint + secret/lifecycle KV), the
in-cluster MinIO object store (Model-B CAS objects), its independently isolated
Authority Backup Adapter, the Target Secret Agent's secret-free decommission
inventory endpoint, and external HTTPS to AWS. The authority has NO mesh
egress. Ingress admits the registered Provider Worker, Bootstrap Broker, and
exact one-shot Credential Provisioner callers;
kubelet liveness/readiness probes are node-local and unaffected.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifecycle-authority-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lifecycle-authority.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prodbox-lifecycle-authority
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: lifecycle
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: provider-worker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-provider-worker
      ports:
        - protocol: TCP
          port: lifecycle
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bootstrap-broker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-bootstrap-broker
      ports:
        - protocol: TCP
          port: lifecycle
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: credential-provisioner
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-credential-provisioner
      ports:
        - protocol: TCP
          port: lifecycle
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
        - protocol: TCP
          port: {{ .Values.ports.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-vault
      ports:
        - protocol: TCP
          port: {{ .Values.ports.vault }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prodbox
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-minio
      ports:
        - protocol: TCP
          port: {{ .Values.ports.objectStore }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authority-backup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-authority-backup
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-secret-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prodbox-target-secret-agent
      ports:
        - protocol: TCP
          port: {{ .Values.ports.controlPlane }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.ports.publicHttps }}
